name: CI/CD

on:
  push:
    tags:
      - "v*.*.*"

# Third-party actions are pinned to full commit SHAs (the tag each one was resolved from is in
# the trailing comment), so a moved tag or branch upstream cannot change what runs here.
permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Before anything is published: a version without notes must not get as far as PyPI
      - name: Check that the changelog has a section for this version
        run: .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.12.7"

      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: ".python-version"

      - name: Install the project
        # --locked fails if uv.lock is out of date instead of resolving afresh
        run: uv sync --locked --all-extras --dev

      - name: Run ruff
        run: uv run ruff check

      - name: Run pyright in strict mode
        run: uv run pyright

      - name: Run tests
        run: uv run pytest

  # Built in a job without the PyPI OIDC permission, so nothing the build installs or runs
  # can mint a publishing token. The publish job only uploads the artifact built here.
  build:
    needs: qa
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.12.7"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: ".python-version"

      # Every build backend and its dependencies are pinned by hash in build-constraints.txt
      - name: Build package
        run: uv build --build-constraints build-constraints.txt --require-hashes

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scaffold-framework
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract the release notes
        run: .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
